<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>PAT</title>
<link rel="icon" type="image/png" href="img/pat-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap">
<style>
/* Layout: app de celular no centro; ao lado, atalhos do protótipo e a legenda dos três tipos de post */
/* identidade PAT: verde-limão #CEFB14 como cor principal, fundo #000000 e texto #FFFFFF (tema único, escuro) */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#141414; --sunk:#1F1F1F; --ink:#FFFFFF; --muted:#A3A3A3; --line:#2E2E2E;
  --pri:#CEFB14; --pri-ink:#000000; --pri-soft:rgba(206,251,20,.14);
  --demo:#F6B547; --aprox:#2CC5B9; --need:#A88BFA;
  --ok:#3CCB78; --ok-soft:#163723; --bad:#FF6B70; --bad-soft:#3D1D21;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.stage{height:100%;display:grid;grid-template-columns:minmax(0,320px) 400px;justify-content:center;align-items:center;gap:56px;padding-block:24px}
.side{display:flex;flex-direction:column;gap:24px}
.brand{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;line-height:1}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--pri);display:grid;place-items:center;color:var(--pri-ink)}
.side p{margin:0;color:var(--muted);max-width:32ch}
.label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side-grp{display:flex;flex-direction:column;gap:10px}
.niche-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jump{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.jump button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;width:100%;box-sizing:border-box;font-weight:700}
.jump button:hover{background:var(--surface)}
.jump button[aria-current="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.jump b{width:24px;height:24px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:12px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-direction:column;gap:10px}
.lg{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:14px}
.lg span{color:var(--muted)}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.lg .dot{margin-top:4px}
.d-demo{background:var(--demo)} .d-aprox{background:var(--aprox)} .d-need{background:var(--need)}

/* aparelho */
.device{--b1:#F2A21B;--b1i:#141414;--b2:#151925;--b2i:#FFFFFF;position:relative;width:400px;height:min(860px,100%);background:var(--bg);border-radius:40px;
  box-shadow:0 0 0 10px #1F1F1F,0 30px 70px -24px rgba(206,251,20,.12);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .back{all:unset;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sunk)}
.top .app{flex:1;display:flex;align-items:center;min-height:36px}
.top .app img{height:34px;width:auto;display:block}
.brand-logo{width:260px;max-width:100%;height:auto;display:block}
.scr{flex:1;overflow-y:auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;white-space:nowrap;font-weight:700;color:var(--muted);position:relative}
.tabs .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"] .pill{background:var(--pri-soft);color:var(--pri)}
.badge{position:absolute;top:-2px;left:calc(50% + 10px);background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 6px;min-width:20px;text-align:center}

h1,h2,h3{margin:0;text-wrap:balance}
.h-xl{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.h-l{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.12;letter-spacing:-.01em}
.h-m{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:6px}
.stack p{margin:0}

.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg i.ok{background:var(--ok)} .seg i.bad{background:var(--bad)} .seg i.cur{background:var(--pri)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:16px;text-align:center;line-height:1.15;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.04)}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn-soft{background:var(--sunk);color:var(--ink)}
.btn-line{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-sm{min-height:42px;padding:8px 14px;font-size:14.5px;border-radius:13px}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.full{width:100%}
.link{all:unset;cursor:pointer;font-weight:700;font-size:15px;color:var(--pri)}

.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.perks .ic{width:32px;height:32px;padding:7px;border-radius:10px;background:var(--pri-soft);color:var(--pri)}
.niches{display:grid;gap:12px}
.niche{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:56px 1fr 20px;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.niche:hover{box-shadow:inset 0 0 0 2px var(--pri)}
.niche .nic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.niche .nic .ic{width:28px;height:28px}
.niche b{font-family:var(--display);font-size:19px;display:block}
.niche small{color:var(--muted);font-size:14px}
.nic.t1{background:color-mix(in srgb,var(--demo) 22%,var(--surface));color:var(--ink)}
.nic.t2{background:color-mix(in srgb,var(--aprox) 22%,var(--surface));color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr 26px;gap:2px 12px;align-items:center;padding:16px 16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);width:100%}
.opt b{font-size:17px}
.opt small{grid-column:1;color:var(--muted);font-size:14px}
.opt .ck{grid-row:1/span 2;grid-column:2;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:var(--pri-ink)}
.opt.multi .ck{border-radius:8px}
.opt .ck .ic{width:16px;height:16px;stroke-width:3;opacity:0}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--pri);background:var(--pri-soft)}
.opt[aria-pressed="true"] .ck{background:var(--pri);box-shadow:none}
.opt[aria-pressed="true"] .ck .ic{opacity:1}
.mixbar{grid-column:1;display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;gap:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:700}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:none}

.input{font-size:18px;font-weight:700;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);width:100%}
.input:focus{outline:none;border-color:var(--pri)}

.box{padding:16px;border-radius:20px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.drop{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;padding:16px;border-radius:20px;border:2px dashed var(--line);background:var(--surface);width:100%}
.drop .nic{width:48px;height:48px;border-radius:14px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.drop code{font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:6px}
.plist{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;padding:4px 14px}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.thumb-btn{position:relative;cursor:pointer;display:block;margin-right:6px}
.thumb-up{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.42);color:#fff}
.thumb-up .ic{width:20px;height:20px}
.pfoto{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--demo) 70%,var(--ink))}
.pfoto.ok{color:var(--ok)}
.pfoto .ic{width:13px;height:13px;stroke-width:3}
.prow b{display:block;font-size:15.5px;line-height:1.25}
.prow small{color:var(--muted);font-size:13px}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn[aria-pressed="true"]{color:var(--demo)}
.icon-btn[aria-pressed="true"] .ic{fill:var(--demo)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;color:var(--muted);font-weight:600}
.steps li.done{color:var(--ink)}
.steps .st{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:#fff}
.steps .st .ic{width:15px;height:15px;stroke-width:3;opacity:0}
.steps li.done .st{background:var(--ok);box-shadow:none}
.steps li.done .st .ic{opacity:1}

/* status */
.stb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.stb .ic{width:16px;height:16px;stroke-width:3}
.stb.ok{background:var(--ok)} .stb.bad{background:var(--bad)}
.stb.wait{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:14px;font-weight:800}
.cnt .ic{width:15px;height:15px;stroke-width:3}
.cnt.ok{background:var(--ok-soft);color:var(--ok)} .cnt.bad{background:var(--bad-soft);color:var(--bad)} .cnt.wait{background:var(--sunk);color:var(--muted)}

/* calendário */
.mixsum{display:flex;flex-direction:column;gap:8px}
.mixsum .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);font-weight:600}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys .dot{width:10px;height:10px}
.keys .stb{width:18px;height:18px}
.keys .stb .ic{width:11px;height:11px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:var(--surface);padding:12px;border-radius:20px}
.cal .wd{font-size:12px;font-weight:800;text-align:center;color:var(--muted);padding-bottom:4px}
.day{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1.15;border-radius:12px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--sunk);position:relative}
.day.empty{background:transparent;cursor:default}
.day.off{color:var(--muted);font-weight:600;background:transparent}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--pri)}
.day .pt{height:6px;border-radius:3px}
.pt.demo{background:var(--demo)} .pt.aprox{background:var(--aprox)} .pt.need{background:var(--need)}
.day .stb{position:absolute;top:-4px;right:-4px;width:19px;height:19px;box-shadow:0 0 0 2px var(--surface)}
.day .stb .ic{width:11px;height:11px}
.day .sp{position:absolute;top:5px;right:5px;color:var(--bad)}
.day .sp .ic{width:12px;height:12px;fill:currentColor;stroke:none}
.day .fm{font-size:10px;color:var(--muted);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cartão de post */
.post{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:22px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 14px 28px -22px rgba(10,20,40,.45);transition:transform .28s ease,opacity .28s ease}
.post.out-r{transform:translateX(110%) rotate(5deg);opacity:0}
.post.out-l{transform:translateX(-110%) rotate(-5deg);opacity:0}
.post>.stb{position:absolute;top:14px;right:14px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-right:38px}
.tag{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--sunk);display:inline-flex;align-items:center;gap:6px}
.tag .dot{width:9px;height:9px}
.tag.edit{background:color-mix(in srgb,var(--demo) 22%,var(--surface))}
.post h3{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.18}
.post h3 em{font-style:normal;color:var(--muted)}
.rot{margin:0;display:flex;flex-direction:column;border-radius:16px;background:var(--sunk);padding:4px 14px}
.rot div{padding:10px 0;border-bottom:1px solid var(--line)}
.rot div:last-child{border-bottom:0}
.rot dt{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rot dd{margin:2px 0 0;font-size:15.5px}
details.cap summary{cursor:pointer;font-weight:800;font-size:15px;color:var(--pri)}
details.cap p{white-space:pre-line;font-size:15px;margin:10px 0 0;padding:14px;border-radius:14px;background:var(--sunk)}
.hash{color:var(--pri);font-weight:700}
.vidline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--pri-soft);font-size:14.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.edit-panel{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--pri)}
.edit{display:flex;flex-direction:column;gap:12px;margin:0}
.edit label{display:flex;flex-direction:column;gap:5px}
.edit textarea,.edit input{font-size:16px;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);resize:vertical;width:100%}
.edit textarea:focus,.edit input:focus{outline:none;border-color:var(--pri)}

.actions{position:sticky;bottom:-28px;margin:0 -18px -28px;padding:14px 18px 18px;background:linear-gradient(to bottom,transparent,var(--bg) 24%);display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;z-index:3}
.actions .btn{min-height:58px;padding:8px 6px;font-size:15.5px;flex-direction:column;gap:3px}
.actions .btn .ic{width:22px;height:22px;stroke-width:2.6}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{padding:14px 12px;border-radius:18px;background:var(--surface)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13.5px;color:var(--muted);font-weight:700}
.stat .ok b{color:var(--ok)} .stat .bad b{color:var(--bad)}

/* arte do post: cores da marca (--b1 principal, --b2 apoio) ficam no aparelho */
.cr{position:relative;overflow:hidden;border-radius:16px;margin:0 auto;width:100%;container-type:inline-size;background:var(--b2);color:var(--b2i);isolation:isolate}
.cr.v{aspect-ratio:9/16;max-width:220px}
.cr.q{aspect-ratio:1/1;max-width:290px}
.cr-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.cr.has-media{color:#fff}
.cr.has-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 35%,transparent 55%,rgba(0,0,0,.7));z-index:-1}
.cr-in{position:absolute;inset:0;padding:9cqw 8cqw 20cqw;display:flex;flex-direction:column;gap:4cqw}
.cr-k{font-size:max(9px,4.4cqw);font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cr-h{font-family:var(--display);font-weight:800;line-height:1.2;font-size:9.5cqw;text-wrap:balance}
.cr-box{background:var(--b1);color:var(--b1i);padding:.04em .22em;border-radius:.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cr-b{font-size:max(10px,5cqw);line-height:1.3;opacity:.92;font-weight:600}
.cr-band{position:absolute;left:0;right:0;bottom:0;height:3.5cqw;background:var(--b1)}
.cr-poll{margin-top:auto;background:#fff;color:#111;border-radius:4cqw;padding:4cqw;display:flex;flex-direction:column;gap:2.5cqw;font-size:max(10px,5.2cqw);font-weight:800}
.cr-poll span{border-radius:3cqw;padding:2.6cqw;background:#ECEEF2;text-align:center}
.cr-poll span:first-child{background:var(--b1);color:var(--b1i)}
.cr-dots{position:absolute;bottom:7cqw;left:0;right:0;display:flex;justify-content:center;gap:1.6cqw}
.cr-dots i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:currentColor;opacity:.35}
.cr-dots i:first-child{opacity:1}
.cr-play{position:absolute;right:6cqw;top:7cqw;font-size:max(9px,4cqw);font-weight:800;background:rgba(0,0,0,.5);color:#fff;padding:1cqw 2.4cqw;border-radius:2cqw}
.wm{position:absolute;right:5cqw;bottom:6.5cqw;max-width:24cqw;max-height:12cqw;object-fit:contain;opacity:.85;z-index:2}
.wm-txt{font-family:var(--display);font-weight:800;font-size:max(9px,4.2cqw);opacity:.75}

.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw button[aria-pressed="true"]{outline:3px solid var(--pri);outline-offset:3px}
.sw .pick{width:42px;height:42px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;font-weight:800;color:var(--muted)}
.sw input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.logo-box .lg-img{width:48px;height:48px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.logo-box img{max-width:88%;max-height:88%}

const STL = {aprovado:'Aprovado', reprovado:'Reprovado', pendente:'Aguardando'};

const S = {
  niche:null, view:'intro', q:0,
  a:{nome:'', tipo:[], publico:[], redes:[], freq:null, mix:null, gravar:null, tom:null, datas:[], horario:null, logo:null, cor1:'#F2A21B', cor2:'#151925'},
  products:[], posts:[], cur:null, sel:null, editing:null, stopped:false,
  vid:{postId:null, url:null, name:null, stage:'setup', o:{formato:'9:16', cortes:true, legenda:'auto', estilo:'marca', musica:'leve', extras:['gancho','logo']}}
};
const FRESH = JSON.stringify(S);

/* ---------- utilidades ---------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
function fmtDate(d){ return `${DIAS[d.getDay()]}, ${d.getDate()} de nov`; }
function pending(){ return S.posts.filter(p=>p.status==='pendente'); }
function count(st){ return S.posts.filter(p=>p.status===st).length; }
function stBadge(p){
  if(p.status==='aprovado') return `<span class="stb ok" title="Pronto para baixar">${ic('check')}</span>`;
  if(p.status==='reprovado') return `<span class="stb bad" title="Reprovado">${ic('x')}</span>`;
  if(missing(p).length) return `<span class="stb warn" title="Falta enviar arquivo">${ic('upload')}</span>`;
  return `<span class="stb wait" title="Aguardando aprovação">${ic('star')}</span>`;
}
function tagLoja(){ return '#'+(S.a.nome||'meunegocio').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase(); }
function makeProduct(nome, cat){
  const low=nome.toLowerCase(), base=N().lib.find(l=>low.includes(l.k));
  if(base) return {...base, nome, cat:cat||base.cat, star:false};
  return {k:'gen', nome, cat:cat||'Geral', art:'', curto:low, star:false, ...N().gen(nome, low)};
}
function nets(fmt){
  const r=S.a.redes.length?S.a.redes:['ig'];
  const map={Reels:['ig','tt','fb'], Stories:['ig','wa','fb'], Carrossel:['ig','fb'], Post:['ig','fb']};
  const n=r.filter(x=>map[fmt].includes(x)); return n.length?n:[r[0]];
}
function noVideo(fmt){ return S.a.gravar==='ninguem' && fmt==='Reels' ? 'Carrossel' : fmt; }

/* ---------- geração do calendário ---------- */
function buildDemo(p, extra){
  return {pillar:'demo', fmt:noVideo('Reels'), title:(extra?.prefix||'')+N().title(p), prod:p.nome, img:imgOf(p), preco:p.preco||PRECO[p.k]||'',
    f:[['Gancho',`"${p.gancho}"`],['Demonstração',p.demo],['Benefício',`"${p.beneficio}"`],['Convite',extra?.convite||N().convite[S.a.tom||'proximo']]]};
}
function buildNeed(p, i){
  return {pillar:'need', fmt:noVideo(i%2?'Carrossel':'Reels'), title:p.dor, prod:p.nome, img:imgOf(p), preco:p.preco||PRECO[p.k]||'',
    f:[['Gancho',`"${p.dorG}"`],['Problema',p.dorT],['Solução',p.sol],['Convite',N().convite[S.a.tom||'proximo']]]};
}
function buildAprox(a, prod){
  const name = prod ? (prod.art ? prod.art+' '+prod.curto : prod.curto) : 'a novidade';
  const sub = s => s.replace('{prod}', name).replace('{loja}', S.a.nome||'empresa');
  return {pillar:'aprox', fmt:noVideo(a.fmt), title:sub(a.t), tema:a.tema, poll:a.poll, img:APROX_IMG[S.niche||'ferramentas'][a.tema]||POOL[S.niche||'ferramentas'][0], f:a.f.map(([k,v])=>[k,sub(v)])};
}
function mkPromo(post, urg){
  const de=post.preco||'';
  return {de, por:de?niceRound(de*0.85):'', parc:S.niche==='turismo'?'10x sem juros':'6x sem juros', urg, restam:S.niche==='turismo'?'8':'5', bonus:[], cupom:'', conf:false};
}
function niceRound(v){ return v>=1000 ? Math.round(v/10)*10 : Math.floor(v)+0.9; }
function finish(post, date){
  const pool=POOL[S.niche||'ferramentas'], img=post.img||imgOf(S.products.find(x=>x.nome===post.prod)||{});
  let img2=pool[date.getDate()%pool.length]; if(img2===img) img2=pool[(date.getDate()+1)%pool.length];
  const promo=post.flag==='Oferta'||post.flag==='Black Friday' ? mkPromo(post, post.flag==='Black Friday'?'Só hoje':'Até domingo') : null;
  return {...post, img, img2, promo, id:'p'+date.getDate(), date, time:S.a.horario||'19:00', nets:nets(post.fmt), status:'pendente', video:null, media:null, cap:null,
    tags:[...N().tags, N().ptags[post.pillar], tagLoja()], edited:false, short:false};
}
function special(d, prods, used){
  const has=k=>S.a.datas.includes(k), L=prods.length;
  if(has('bf') && d===27){ const p=buildDemo(prods[0],{prefix:'Black Friday: ', convite:N().bf}); p.flag='Black Friday'; return p; }
  if(has('feriado') && d>=16 && d<=19 && !used.has('feriado')){ used.add('feriado');
    return {pillar:'need', fmt:noVideo('Reels'), flag:'Feriado 20/11', prod:prods[0].nome, title:'Feriadão de 20 de novembro: ainda dá tempo de viajar',
      f:[['Gancho','"Sexta é feriado. Você já sabe para onde vai?"'],['Problema','Quem decide na véspera encontra menos opção e preço mais alto.'],['Solução',`Mostrar 3 opções de última hora, começando por ${prods[0].nome}.`],['Convite','"Ainda temos vagas. Chama no WhatsApp."']]}; }
  if(has('ferias') && d>=24 && d!==27 && !used.has('ferias')){ used.add('ferias');
    return {pillar:'need', fmt:'Carrossel', flag:'Férias', prod:prods[1%L].nome, title:'Réveillon e férias: garanta antes de dezembro',
      f:[['Gancho','"Já decidiu onde vai virar o ano?"'],['Problema','Perto da data, voos e hotéis ficam mais caros e as melhores opções esgotam.'],['Solução',`Carrossel com destinos para a virada e as férias, começando por ${prods[1%L].nome}.`],['Convite','"Fale com a gente e veja as condições de pagamento."']]}; }
  if(has('natal') && d>=26 && d!==27 && !used.has('natal')){ used.add('natal');
    return {pillar:'need', fmt:'Carrossel', flag:'Natal', prod:prods[1%L].nome, title:'Presente para quem vive consertando tudo',
      f:[['Gancho','"Já sabe o que dar para aquele tio que conserta tudo?"'],['Problema','Presente genérico acaba esquecido na gaveta.'],['Solução',`Carrossel com 4 ferramentas úteis por faixa de preço, começando por ${prods[1%L].nome}.`],['Convite','"Embrulhamos para presente. Encomende pelo WhatsApp."']]}; }
  return null;
}
function generate(){
  const days={3:[1,3,5],5:[1,2,3,4,5],7:[0,1,2,3,4,5,6]}[S.a.freq||'5'];
  const mix=MIX[S.a.mix||'equilibrio'], prods=[...S.products].sort((a,b)=>b.star-a.star);
  const used={demo:0,aprox:0,need:0}, flags=new Set(), A=N().aprox, out=[];
  let di=0, ni=0, ai=0, prev=null, n=0;
  for(let d=2; d<=29; d++){
    const date=new Date(2026,10,d);
    if(!days.includes(date.getDay())) continue;
    n++;
    let best=null, bs=-1e9;
    for(const k of ['demo','aprox','need']){ let s=mix[k]*n-used[k]; if(k===prev) s-=.6; if(s>bs){bs=s; best=k;} }
    used[best]++; prev=best;
    let post=special(d, prods, flags);
    if(!post){
      if(best==='demo'){
        const p=prods[di++%prods.length];
        post = date.getDay()===5 && S.a.datas.includes('oferta') ? {...buildDemo(p,{prefix:'Oferta da semana: ', convite:'"Oferta válida até domingo ou enquanto durar o estoque."'}), flag:'Oferta'} : buildDemo(p);
      } else if(best==='need'){ post=buildNeed(prods[(ni+1)%prods.length], ni++); }
      else { post=buildAprox(A[ai%A.length], prods[ai%prods.length]); ai++; }
    }
    out.push(finish(post, date));
  }
  S.posts=out; S.sel=out[0]?.id; S.cur=null;
}

/* ---------- navegação ---------- */
const scr = () => $('#scr');
function go(view){
  if(['calendario','aprovar','video','baixar'].includes(view)) ensureDemo();
  if(view==='produtos') ensureAnswers();
  if(view==='quiz' && !S.niche) S.niche='ferramentas';
  S.view=view; S.editing=null; if(view==='aprovar') S.stopped=false;
  render(); scr().scrollTop=0;
}
function ensureAnswers(){
  if(!S.niche) S.niche='ferramentas';
  const def={...N().def, redes:['ig','wa'], freq:'5', mix:'equilibrio', gravar:'equipe', tom:'proximo', horario:'19:00'};
  for(const k in def){ const v=S.a[k]; if(v===null||v===''||(Array.isArray(v)&&!v.length)) S.a[k]=def[k]; }
}
function ensureDemo(){
  ensureAnswers();
  if(!S.products.length) S.products=N().lib.slice(0,6).map((l,i)=>({...l, star:i===0}));
  if(!S.posts.length) generate();
}
function loadDemo(niche){
  Object.assign(S, JSON.parse(FRESH)); S.niche=niche; ensureDemo(); S.view='calendario'; render(); scr().scrollTop=0;
  toast(`Exemplo de ${NICHES[niche].nome.toLowerCase()} carregado`);
}

/* ---------- render ---------- */
function render(){
  applyBrand();
  applyProdPhotos();
  normalize();
  const inApp=['calendario','aprovar','video','produtos','baixar'].includes(S.view) && S.posts.length;
  const tb=$('#topback'); tb.hidden = !['quiz','produtos'].includes(S.view) || inApp;
  $('#tabs').hidden=!inApp;
  if(inApp){
    const pend=pending().length;
    $('#tabs').innerHTML = [['calendario','cal','Calendário'],['aprovar','check','Aprovar'],['video','video','Vídeos'],['baixar','dl','Baixar'],['produtos','store','Negócio']]
      .map(([k,i,l])=>`<button data-tab="${k}" aria-current="${S.view===k}"><span class="pill">${ic(i)}</span>${l}${k==='aprovar'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');
    $$('#tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='video'){ S.vid.postId=null; S.vid.stage='setup'; } go(b.dataset.tab); });
  }
  const map={intro:'intro', quiz:'quiz', produtos:'produtos', gerando:'calendario', calendario:'calendario', aprovar:'aprovar', video:'video', baixar:'baixar'};
  $$('#jump button').forEach(b=>b.setAttribute('aria-current', b.dataset.go===map[S.view]));
  ({intro:vIntro, quiz:vQuiz, produtos:vProdutos, gerando:vGerando, calendario:vCal, aprovar:vAprovar, video:vVideo, baixar:vBaixar})[S.view]();
  bindArt();
  save();
}

function vQuiz(){
  const QS=questions(), Q=QS[S.q], v=S.a[Q.k];
  let body='';
  if(Q.type==='text'){
    body=`<input class="input" id="nome" value="${esc(v)}" placeholder="Ex.: ${esc(Q.sug[0])}" autocomplete="organization" aria-label="Nome do negócio">
      <div class="stack" style="gap:8px"><span class="label">Exemplos</span><div class="chips">${Q.sug.map(s=>`<button class="chip" data-sug="${esc(s)}" aria-pressed="${v===s}">${esc(s)}</button>`).join('')}</div></div>`;
  } else if(Q.type==='logo'||Q.type==='colors'){
    body=brandHTML(Q.type);
  } else {
    body=`<div class="opts">${Q.o.map(([k,l,sub])=>{
      const on=Q.type==='multi'?v.includes(k):v===k;
      const bar=Q.mixbar?`<span class="mixbar"><i class="d-demo" style="flex:${MIX[k].demo}"></i><i class="d-aprox" style="flex:${MIX[k].aprox}"></i><i class="d-need" style="flex:${MIX[k].need}"></i></span>`:'';
      return `<button class="opt ${Q.type==='multi'?'multi':''}" data-k="${k}" aria-pressed="${on}"><b>${esc(l)}</b><span class="ck">${ic('check')}</span>${sub?`<small>${esc(sub)}</small>`:''}${bar}</button>`;}).join('')}</div>`;
  }
  const isBrand=Q.type==='logo'||Q.type==='colors';
  const canNext=isBrand?true:Q.type==='text'?!!(v||'').trim():Q.type==='multi'?v.length>0:!!v;
  scr().innerHTML=`
    <div class="progress"><i style="width:${(S.q)/QS.length*100}%"></i></div>
    <div class="stack"><h2 class="h-l">${esc(Q.t)}</h2>${Q.h?`<p class="muted small">${esc(Q.h)}</p>`:''}</div>
    ${body}
    <div style="flex:1"></div>
    ${Q.type!=='single'?`<button class="btn btn-pri full" id="next" ${canNext?'':'disabled'}>${Q.type==='logo'&&!S.a.logo?'Pular por agora':'Continuar'} ${ic('arrow')}</button>`:''}`;
  const next=()=>{ if(S.q<QS.length-1){S.q++; render(); scr().scrollTop=0;} else {S.view='produtos'; render(); scr().scrollTop=0;} };
  if($('#next')) $('#next').onclick=next;
  if(Q.type==='text'){
    const inp=$('#nome');
    inp.oninput=()=>{ S.a.nome=inp.value; $('#next').disabled=!inp.value.trim(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()) next(); };
    $$('[data-sug]').forEach(b=>b.onclick=()=>{ S.a.nome=b.dataset.sug; next(); });
  } else if(isBrand){ bindBrand(); }
  else {
    $$('.opt').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(Q.type==='single'){ S.a[Q.k]=k; $$('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b)); setTimeout(next, reduce?0:220); }
      else {
        let arr=S.a[Q.k];
        if(k==='nenhuma') arr=arr.includes('nenhuma')?[]:['nenhuma'];
        else { arr=arr.filter(x=>x!=='nenhuma'); arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k]; }
        S.a[Q.k]=arr; const st=scr().scrollTop; render(); scr().scrollTop=st;
      }
    });
  }
}

  scr().innerHTML=`

    <input type="file" id="pfotos" class="sr" accept="image/*" multiple>

    <div class="stack" style="gap:8px"><span class="label">${S.products.length} na sua lista${S.products.length?` · ${S.products.filter(p=>fotosOf(p).length).length} com foto`:''}</span>
      ${S.products.length?`<div class="plist">${S.products.map((p,i)=>{ const fs=fotosOf(p); return `
        <div class="prow"><label class="thumb-btn" for="pf-${i}" aria-label="Enviar foto de ${esc(p.nome)}"><img class="thumb" src="${fs.length?PHOTO[fs[fs.length-1]]:`img/${imgOf(p)}.jpg`}" alt="">${fs.length?'':`<span class="thumb-up">${ic('upload')}</span>`}</label><input type="file" id="pf-${i}" class="sr" data-pfoto="${i}" accept="image/*" multiple>
          <div><b>${esc(p.nome)}</b><small>${esc(p.cat)}${PRECO[p.k]?` · ${brl(PRECO[p.k])}`:''}</small><span class="pfoto ${fs.length?'ok':''}">${fs.length?`${ic('check')} ${fs.length>1?fs.length+' fotos suas':'Foto sua'}`:'Sem foto: toque na imagem'}</span></div>
          <button class="icon-btn" data-star="${i}" aria-pressed="${p.star}" aria-label="Destacar ${esc(p.nome)}">${ic('star')}</button>
          <button class="icon-btn" data-del="${i}" aria-label="Remover ${esc(p.nome)}">${ic('trash')}</button></div>`; }).join('')}</div>`
      :`<p class="muted small" style="margin:0">Sua lista está vazia. <button class="link" id="sample">Usar lista de exemplo</button></p>`}
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-pri full" id="gen" ${S.products.length?'':'disabled'}>${hasPosts?'Criar posts de novo com esta lista':'Criar meus posts'} ${ic('arrow')}</button>
    ${hasPosts?`<button class="btn btn-bad full" id="reset">${ic('trash')} Começar do zero ou trocar de ramo</button>

  $$('[data-add]').forEach(b=>b.onclick=()=>{ S.products.push({...n.lib.find(x=>x.k===b.dataset.add), star:false}); keep(render); });
  $$('[data-star]').forEach(b=>b.onclick=()=>{ const p=S.products[b.dataset.star]; p.star=!p.star; keep(render); });
  $$('[data-del]').forEach(b=>b.onclick=()=>{ S.products.splice(+b.dataset.del,1); keep(render); });
  if($('#sample')) $('#sample').onclick=()=>{ S.products=n.lib.slice(0,6).map((l,i)=>({...l,star:i===0})); render(); };
  $('#pfotos').onchange=e=>{ const fs=[...e.target.files]; if(fs.length) addProdPhotos(fs); };
  $$('[data-pfoto]').forEach(inp=>inp.onchange=e=>{ const fs=[...e.target.files]; if(fs.length) addProdPhotos(fs, S.products[+inp.dataset.pfoto]); });
  if($('#orph-add')) $('#orph-add').onclick=orphansAsProducts;
  if($('#orph-x')) $('#orph-x').onclick=()=>{ orphan=[]; render(); };
  $('#csv').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let added=0;
      String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{
        const [nome,cat]=l.split(/[;,\t]/).map(s=>(s||'').trim().replace(/^"|"$/g,''));
        if(!nome||(i===0&&/nome|produto|pacote/i.test(nome))) return;
        if(S.products.some(p=>p.nome.toLowerCase()===nome.toLowerCase())) return;
        S.products.push(makeProduct(nome,cat)); added++;

      toast(added?`${added} ${added>1?'itens adicionados':'item adicionado'}`:'Nenhum item novo no arquivo'); render();

    }

  }
}
function keep(fn){ const st=scr().scrollTop; fn(); scr().scrollTop=st; }

function vGerando(){
  const days={3:12,5:20,7:28}[S.a.freq||'5'];
  const steps=[`Lendo ${S.products.length} itens da sua lista`, `Separando ${days} dias de post em novembro`, 'Misturando demonstração, aproximação e necessidade', 'Aplicando sua logo e suas cores', 'Escrevendo roteiros, legendas e hashtags'];

/* ---------- o que cada post precisa para ficar pronto ---------- */
const NEED_FOTO = {
  ferramentas:{'Bastidores':'Foto da mercadoria chegando','História da loja':'Foto antiga ou atual da loja','Equipe':'Foto de alguém da equipe'},
  turismo:{'Bastidores':'Foto da equipe no passeio','História da empresa':'Foto antiga ou atual da empresa','Cliente feliz':'Foto de um cliente (com autorização)','Equipe':'Foto de alguém da equipe'}
};
function reqs(p){
  const r=[], tur=S.niche==='turismo', has=t=>p.media&&p.media.type===t;
  if(p.fmt==='Reels') r.push({k:'video', t:p.prod?'Seu vídeo ou a foto do produto':'Seu vídeo', h:`O que gravar: ${unq(p.f[1][1])}${p.prod?' Ou envie a foto do produto e o app monta o vídeo.':''}`, done:has('video')||(!!p.prod&&has('image'))});
  else {
    const t = p.pillar==='aprox' ? NEED_FOTO[S.niche||'ferramentas'][p.tema] : p.prod ? (tur?`Foto do passeio ou destino: ${p.prod}`:`Foto do produto: ${p.prod}`) : null;
    if(t) r.push({k:'foto', t, h:p.pillar==='aprox'?'Foto de celular serve.':tur?'Sua ou de um parceiro: hotel, guia, passeio.':'Na prateleira ou em uso. Foto de celular serve.', done:has('image')||has('video')});
  }
  if(p.promo){ const o=p.promo; r.push({k:'precos', t:'Preços da promoção', h:'Confira o preço normal e o da promoção.', done:!!(o.conf&&o.de&&o.por&&+o.por<+o.de)}); }
  return r;
}
const missing = p => reqs(p).filter(x=>!x.done);
const ready = p => p.status==='aprovado' && !missing(p).length;
function reqBox(p){
  const r=reqs(p); if(!r.length) return '';
  const miss=r.filter(x=>!x.done);
  const act=x=> x.k==='video' ? `<label class="btn btn-pri btn-sm" for="rqv-${p.id}">Enviar</label><input type="file" class="sr" id="rqv-${p.id}" data-media="${p.id}" accept="${p.prod?'video/*,image/*':'video/*'}">`
    : x.k==='foto' ? `<label class="btn btn-pri btn-sm" for="rqf-${p.id}">Enviar</label><input type="file" class="sr" id="rqf-${p.id}" data-media="${p.id}" accept="image/*">`
    : `<button class="btn btn-pri btn-sm" data-goprice="${p.id}">Preencher</button>`;
  return `<div class="req ${miss.length?'':'ok'}" id="req-${p.id}">
    <div class="req-h">${miss.length?`${ic('upload')} Para ficar pronto, envie:`:`${ic('check')} Tudo enviado. Pronto para aprovar.`}</div>
    ${r.map(x=>`<div class="req-i ${x.done?'done':''}"><span class="req-c">${ic(x.done?'check':'upload')}</span><div><b>${esc(x.t)}</b>${x.done?'':`<small>${esc(x.h)}</small>`}</div>${x.done?'<span class="req-ok">Enviado</span>':act(x)}</div>`).join('')}
    ${miss.length&&S.view==='aprovar'?`<button class="link" data-skip="${p.id}" style="align-self:flex-start;font-size:14px">Não tenho agora. Deixar para depois →</button>`:''}
  </div>`;
}
function refreshReq(p){
  const el=$('#req-'+p.id); if(el){ el.outerHTML=reqBox(p); bindCard(); }
  const ok=$('#ok'); if(ok&&S.view==='aprovar') okState(ok,p);
}
function okState(btn,p){
  if(!btn) return; const n=missing(p).length;
  btn.className='btn '+(n?'locked':'btn-ok');
  btn.innerHTML=n?`${ic('upload')} Falta ${n}`:`${ic('check')} Aprovar`;
}
function nudge(p){
  const el=$('#req-'+p.id);
  if(el){ el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'}); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  toast('Envie o que falta para aprovar');
}
let mediaReady=false;
function normalize(){
  if(!mediaReady) return; let n=0;
  S.posts.forEach(p=>{ if(p.status==='aprovado'&&missing(p).length){ p.status='pendente'; n++; } });
  if(n) toast(`${n} post${n>1?'s voltaram':' voltou'} para aprovação: falta arquivo`);
}
/* fotos e vídeos enviados ficam guardados neste aparelho (IndexedDB) */
const IDB={
  db:null,
  open(){ return this.db||(this.db=new Promise((res,rej)=>{ const r=indexedDB.open('bancada',1); r.onupgradeneeded=()=>r.result.createObjectStore('media'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async put(k,v){ try{ const db=await this.open(); await new Promise((res,rej)=>{ const tx=db.transaction('media','readwrite'); tx.objectStore('media').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction('media').objectStore('media').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
};
function setMedia(p,m){
  const key='m'+Date.now()+Math.random().toString(36).slice(2,6);
  if(m.type==='video'&&m.file) IDB.put(key,m.file); else if(m.type==='image') IDB.put(key,m.url);
  p.media={type:m.type, url:m.url, name:m.name, key};
}
/* fotos dos produtos: o nome do arquivo igual ao nome do item na planilha liga a foto ao produto */
const PHOTO={};
let orphan=[];
const normName = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const baseName = f => normName(f.name.replace(/\.[^.]+$/,''));
function matchProduct(f){
  const b=baseName(f), cut=b.replace(/\s+\d{1,2}$/,'');
  return S.products.find(p=>normName(p.nome)===b) || S.products.find(p=>normName(p.nome)===cut);
}
function readPhoto(file){
  return new Promise(res=>{
    const u=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=Math.min(1,1080/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82)); };
    img.onerror=()=>{ URL.revokeObjectURL(u); res(null); };
    img.src=u;
  });
}
async function savePhoto(pr, f){
  const url=await readPhoto(f); if(!url) return false;
  const key='f'+Date.now()+Math.random().toString(36).slice(2,6);
  await IDB.put(key,url); PHOTO[key]=url;
  pr.fotos=[...(pr.fotos||[]), key].slice(-5);
  return true;
}
const fotosOf = pr => (pr?.fotos||[]).filter(k=>PHOTO[k]);
function prodPhoto(p){
  const pr=S.products.find(x=>x.nome===p.prod), ks=fotosOf(pr); if(!ks.length) return null;
  const k=ks[p.date.getDate()%ks.length];
  return {type:'image', url:PHOTO[k], name:pr.nome, key:k, auto:true};
}
function applyProdPhotos(){
  if(!mediaReady) return;
  S.posts.forEach(p=>{
    if(p.media&&!p.media.auto) return;
    const m = p.prod&&p.pillar!=='aprox'&&!p.noAuto ? prodPhoto(p) : null;
    if(m){ if(!p.media||p.media.key!==m.key) p.media=m; } else if(p.media) p.media=null;
  });
}
async function addProdPhotos(files, pr){
  let ok=0, bad=0; const miss=[];
  for(const f of files){
    if(!f.type.startsWith('image/')){ bad++; continue; }
    const t=pr||matchProduct(f);
    if(!t){ miss.push(f); continue; }
    if(await savePhoto(t,f)) ok++; else bad++;
  }
  if(!pr) orphan=miss;
  applyProdPhotos();
  const used=S.posts.filter(p=>p.media?.auto).length;
  render();
  toast(ok ? `${ok} foto${ok>1?'s ligadas aos itens':' ligada ao item'}${used?` · ${used} posts já usam`:''}` : miss.length ? 'Nenhum nome de foto bate com a lista' : 'Não consegui abrir essas fotos');
}
function niceName(f){
  const s=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+\d{1,2}$/,'').replace(/\s+/g,' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
async function orphansAsProducts(){
  const files=orphan; orphan=[];
  for(const f of files){
    const nome=niceName(f); if(!nome) continue;
    let pr=S.products.find(p=>normName(p.nome)===normName(nome));
    if(!pr){ pr=makeProduct(nome,''); S.products.push(pr); }
    await savePhoto(pr,f);
  }
  applyProdPhotos(); render(); toast('Itens novos criados com as fotos');
}
async function restoreMedia(){
  if(logoInIdb&&!S.a.logo){ const v=await IDB.get('logo'); if(v){ S.a.logo=v; logoIdb=v; } }
  for(const pr of S.products) for(const k of pr.fotos||[]) if(!PHOTO[k]){ const v=await IDB.get(k); if(v) PHOTO[k]=v; }
  for(const p of S.posts){
    if(p.media&&p.media.key&&!p.media.url){ const v=await IDB.get(p.media.key); if(v) p.media.url=typeof v==='string'?v:URL.createObjectURL(v); else p.media=null; }
  }
  mediaReady=true;
}

        :sel.status==='aprovado'
        ?`<button class="btn btn-soft" data-set="pendente">${ic('undo')} Desfazer aprovação</button><button class="btn btn-soft" data-ed="${sel.id}">${ic('edit')} Editar</button>`
        :`<button class="btn btn-soft" data-new="${sel.id}">${ic('refresh')} Pedir outra ideia</button><button class="btn btn-ok" data-set="aprovado">${ic('check')} Aprovar</button>`}</div></div>`:''}`;
  $$('[data-day]').forEach(b=>b.onclick=()=>{ S.sel=b.dataset.day; S.editing=null; render(); });
  if($('#toapp')) $('#toapp').onclick=()=>go('aprovar');
  if($('#todl')) $('#todl').onclick=()=>go('baixar');
  $$('[data-set]').forEach(b=>b.onclick=()=>{ if(b.dataset.set==='aprovado'&&missing(sel).length) return nudge(sel); sel.status=b.dataset.set; S.editing=null; keep(render); toast(b.dataset.set==='pendente'?'Voltou para aguardando':`${STL[b.dataset.set]}: ${fmtDate(sel.date)}`); });
  $$('[data-ed]').forEach(b=>b.onclick=()=>{ S.editing=S.editing===sel.id?null:sel.id; keep(render); });
  $$('[data-new]').forEach(b=>b.onclick=()=>{ newIdea(sel); keep(render); toast('Nova ideia para este dia'); });

}

/* ---------- aprovação ---------- */
function seg(curId){ return `<div class="seg" aria-hidden="true">${S.posts.map(p=>`<i class="${p.id===curId?'cur':p.status==='aprovado'?'ok':p.status==='reprovado'?'bad':missing(p).length?'warn':''}"></i>`).join('')}</div>`; }
function counts(){ return `<div class="counts"><span class="cnt ok">${ic('check')} ${count('aprovado')}</span><span class="cnt bad">${ic('x')} ${count('reprovado')}</span><span class="cnt wait">${pending().length} aguardando</span></div>`; }
function discardAll(){
  const a=count('aprovado'), r=count('reprovado');
  if(!a&&!r){ toast('Nenhuma aprovação para descartar'); return; }
  confirmSheet({title:'Descartar as aprovações?', text:`${a} aprovados e ${r} reprovados voltam para "aguardando". Os textos e fotos que você editou continuam.`, yes:'Sim, descartar', onYes:()=>{ S.posts.forEach(p=>p.status='pendente'); S.cur=null; S.stopped=false; S.view='aprovar'; render(); scr().scrollTop=0; toast('Aprovações descartadas'); }});
}
function vAprovar(){
  const pend=pending(), tot=S.posts.length;
  if(S.stopped && pend.length){
    scr().innerHTML=`${seg(null)}
      <div class="stack"><h2 class="h-xl">Tudo salvo!</h2><p class="muted">Pode fechar o app. Quando voltar, você continua deste ponto.</p></div>
      <div class="stat"><div class="ok"><b>${count('aprovado')}</b><span>aprovados</span></div><div class="bad"><b>${count('reprovado')}</b><span>reprovados</span></div><div><b>${pend.length}</b><span>faltam</span></div></div>
      <div style="flex:1"></div>
      <button class="btn btn-pri full" id="resume">${ic('arrow')} Continuar aprovando</button>
      ${count('aprovado')?`<button class="btn btn-soft full" id="todl">${ic('dl')} Baixar os já aprovados</button>`:''}
      <button class="btn btn-soft full" id="tocal">${ic('cal')} Ver calendário</button>
      <button class="btn btn-bad full" id="discard">${ic('undo')} Descartar aprovações</button>`;
    $('#resume').onclick=()=>{ S.stopped=false; render(); };
    if($('#todl')) $('#todl').onclick=()=>go('baixar');
    $('#tocal').onclick=()=>go('calendario'); $('#discard').onclick=discardAll; return;
  }
  if(!pend.length){
    const ok=S.posts.filter(p=>p.status==='aprovado'), vids=ok.filter(p=>p.fmt==='Reels'&&!p.video), bad=S.posts.filter(p=>p.status==='reprovado');
    scr().innerHTML=`${seg(null)}
      <div class="stack"><h2 class="h-xl">Novembro revisado!</h2><p class="muted">Os aprovados saem sozinhos no dia e horário marcados.</p></div>
      <div class="stat"><div class="ok"><b>${ok.length}</b><span>aprovados</span></div><div class="bad"><b>${bad.length}</b><span>reprovados</span></div><div><b>${vids.length}</b><span>vídeos a gravar</span></div></div>
      ${bad.length?`<div class="stack" style="gap:8px"><span class="label">Reprovados: peça outra ideia</span>${bad.slice(0,4).map(p=>`<button class="plink" data-redo="${p.id}"><span class="date-chip">${p.date.getDate()}<br>nov</span><b>${esc(p.title)}</b>${ic('refresh')}</button>`).join('')}</div>`:''}
      ${vids.length?`<div class="stack" style="gap:8px"><span class="label">Vídeos para gravar</span>${vids.slice(0,3).map(p=>`<button class="plink" data-vid="${p.id}"><span class="date-chip">${p.date.getDate()}<br>nov</span><b>${esc(p.title)}</b>${ic('video')}</button>`).join('')}</div>`:''}
      ${ok.length?`<button class="btn btn-ok full" id="todl">${ic('dl')} Baixar os ${ok.length} posts prontos</button>`:''}
      <button class="btn btn-soft full" id="tocal">${ic('cal')} Ver calendário</button>
      <button class="btn btn-bad full" id="discard">${ic('undo')} Descartar aprovações</button>`;
    if($('#todl')) $('#todl').onclick=()=>go('baixar');
    $('#tocal').onclick=()=>go('calendario'); $('#discard').onclick=discardAll;
    $$('[data-redo]').forEach(b=>b.onclick=()=>{ newIdea(S.posts.find(x=>x.id===b.dataset.redo)); render(); toast('Nova ideia pronta para aprovar'); });
    bindCard(); return;
  }
  if(!S.cur||!pend.find(p=>p.id===S.cur)) S.cur=pend[0].id;
  const p=S.posts.find(x=>x.id===S.cur), idx=S.posts.indexOf(p)+1;
  scr().innerHTML=`
    <div class="stack" style="gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Post ${idx} de ${tot}</b>${counts()}</div>
      ${seg(p.id)}
    </div>
    <div class="row">
      <button class="btn btn-soft btn-sm" id="stop">${ic('save')} Salvar e terminar depois</button>
      <button class="btn btn-soft btn-sm" id="discard" style="color:var(--bad)">${ic('undo')} Descartar aprovações</button>
    </div>
    ${postCard(p)}
    <div class="actions">
      <button class="btn btn-bad" id="no">${ic('x')} Reprovar</button>
      <button class="btn btn-soft" id="ed" aria-pressed="${S.editing===p.id}">${ic('edit')} ${S.editing===p.id?'Fechar':'Editar'}</button>
      <button class="btn btn-ok" id="ok"></button>
    </div>`;
  bindCard();
  const leave=(cls,fn)=>{ const c=$('#card'); if(reduce){fn();return;} c.classList.add(cls); setTimeout(fn,260); };
  okState($('#ok'),p);
  const nextAfter=()=>{ const pend=pending(); if(!pend.length) return null; return (pend.find(x=>x.date>p.date)||pend[0]).id; };
  const decide=(st,cls)=>leave(cls,()=>{ p.status=st; S.editing=null; S.cur=nextAfter(); render(); scr().scrollTop=0; toast(st==='aprovado'?`Pronto para baixar: ${fmtDate(p.date)}`:`Reprovado: ${fmtDate(p.date)}`); });
  $('#ok').onclick=()=>{ if(missing(p).length) return nudge(p); decide('aprovado','out-r'); };
  $('#no').onclick=()=>decide('reprovado','out-l');
  $('#ed').onclick=()=>{ S.editing=S.editing===p.id?null:p.id; keep(render); };
  $('#stop').onclick=()=>{ S.stopped=true; S.editing=null; render(); scr().scrollTop=0; toast('Progresso salvo'); };
  $('#discard').onclick=discardAll;
}

function confirmSheet({title,text,yes,onYes}){

    <span class="warn">${ic('undo')}</span><div class="stack"><h3 class="h-m" id="stt">${esc(title)}</h3><p class="muted">${esc(text)}</p></div>
    <div class="row"><button class="btn btn-soft" id="sno">Cancelar</button><button class="btn btn-bad" id="syes" style="background:var(--bad);color:#fff">${esc(yes)}</button></div></div></div>`;

}

    $$('[data-vo]').forEach(b=>b.onclick=()=>{ v.o[b.dataset.vo]=b.dataset.val; keep(render); });

let ovTimer=null;
function playOverlay(p){
  clearInterval(ovTimer);
  const lines=[unq(p.f[0][1]), unq(p.f[1][1]).split(/[,.]/)[0], unq(p.f[2][1]), unq(p.f[3][1])], T=12, t0=performance.now();
  ovTimer=setInterval(()=>{
    if(!document.getElementById('vp')){ clearInterval(ovTimer); return; }
    const t=((performance.now()-t0)/1000)%T;
    $('#vbar').style.width=(t/T*100)+'%';
    const h=$('#ovh'); if(h) h.classList.toggle('hidden-o', t>3.2);
    const pr=$('#ovp'); if(pr) pr.classList.toggle('hidden-o', t<4||t>8);
    const c=$('#ovc'); if(c){ c.textContent=lines[Math.min(3,Math.floor(t/2.6))]; c.classList.toggle('hidden-o', t>10); }
    $('#ove').classList.toggle('hidden-o', t<10.2);
  },120);
}

/* ---------- marca: logo, cores e arte ---------- */
const P1=['#F2A21B','#E03A3E','#F26B1D','#1D4E89','#2D6A4F','#2F5BFF'];
const P2=['#151925','#FFFFFF','#4A5560','#0B2545','#F3EBDD','#0E5E57'];
function ink(hex){ const n=parseInt(String(hex).slice(1),16); if(isNaN(n)) return '#FFFFFF'; const L=(0.2126*(n>>16&255)+0.7152*(n>>8&255)+0.0722*(n&255))/255; return L>0.6?'#141414':'#FFFFFF'; }
function applyBrand(){ const d=$('#device').style; d.setProperty('--b1',S.a.cor1); d.setProperty('--b1i',ink(S.a.cor1)); d.setProperty('--b2',S.a.cor2); d.setProperty('--b2i',ink(S.a.cor2)); }
function swatches(k,list){
  const cur=(S.a[k]||'').toLowerCase();
  return `<div class="sw">${list.map(c=>`<button data-sw="${k}" data-c="${c}" style="background:${c}" aria-pressed="${cur===c.toLowerCase()}" aria-label="Cor ${c}"></button>`).join('')}<label class="pick" title="Outra cor">+<input type="color" data-pick="${k}" value="${S.a[k].toLowerCase()}" aria-label="Escolher outra cor"></label></div>`;
}
function brandHTML(which){
  const logo=`<label class="drop logo-box" for="logof"><span class="lg-img">${S.a.logo?`<img src="${S.a.logo}" alt="Sua logo">`:ic('upload')}</span><span><b>${S.a.logo?'Trocar logo':'Enviar logo'}</b><br><span class="muted small">PNG sem fundo</span></span></label>
    <input type="file" id="logof" class="sr" accept="image/*">${S.a.logo?'<button class="link" id="logorm" style="align-self:flex-start">Remover logo</button>':''}`;
  const cores=`<div class="stack" style="gap:8px"><span class="label">Cor principal</span>${swatches('cor1',P1)}</div><div class="stack" style="gap:8px"><span class="label">Cor de fundo</span>${swatches('cor2',P2)}</div>`;
  const prev=`<div class="stack" style="gap:8px"><span class="label">Como fica</span><div class="prev-w">${creative(N().sample)}</div></div>`;
  return which==='logo'?logo+prev:which==='colors'?cores+prev:logo+cores+prev;
}
function bindBrand(){
  const lf=$('#logof'); if(lf) lf.onchange=e=>{ const f=e.target.files[0]; if(!f) return; readImage(f,400,'image/png',url=>{ S.a.logo=url; keep(render); toast('Logo colocada nos posts'); }); };
  if($('#logorm')) $('#logorm').onclick=()=>{ S.a.logo=null; keep(render); };
  $$('[data-sw]').forEach(b=>b.onclick=()=>{ S.a[b.dataset.sw]=b.dataset.c; keep(render); });
  $$('[data-pick]').forEach(i=>{ i.oninput=()=>{ S.a[i.dataset.pick]=i.value; applyBrand(); }; i.onchange=()=>{ S.a[i.dataset.pick]=i.value; keep(render); }; });
}
function readImage(file,max,type,cb){
  const u=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); cb(c.toDataURL(type,.82)); };
  img.onerror=()=>{ URL.revokeObjectURL(u); toast('Não consegui abrir essa imagem'); };
  img.src=u;
}
function readMedia(file,cb){ if(file.type.startsWith('video/')) return cb({type:'video',url:URL.createObjectURL(file),name:file.name,file}); readImage(file,1080,'image/jpeg',url=>cb({type:'image',url,name:file.name})); }
/* arte: Reels toca como vídeo, Carrossel desliza, Stories e Post são uma imagem */
function creative(p){
  const id='art-'+(p.id||'s');
  return p.fmt==='Carrossel' ? carousel(p,id) : p.fmt==='Reels' ? reels(p,id) : single(p,id);
}
function bgMedia(p, kb){
  const m=p.media&&p.media.url?p.media:null;
  if(m) return m.type==='video' ? `<video class="ph" src="${m.url}" autoplay muted loop playsinline></video>` : `<img class="ph ${kb?'kb':''}" src="${m.url}" alt="">`;
  return p.img ? `<img class="ph ${kb?'kb':''}" src="img/${p.img}.jpg" alt="">` : '';
}
const wmark = () => S.a.logo ? `<img class="wm" src="${S.a.logo}" alt="">` : `<span class="wm wm-txt">${esc(S.a.nome||'')}</span>`;
function brl(v){ const n=+v; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
function parseMoney(s){ s=String(s).trim(); if(!s) return ''; const n=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s); return isNaN(n)?'':n; }
function fmtIn(v){ return v===''||v==null ? '' : Number(v).toFixed(2).replace('.',','); }
function pctNum(o){ return o&&o.de&&o.por&&+o.por<+o.de ? Math.round((1-o.por/o.de)*100) : 0; }
function pctLine(o){
  if(o.de&&o.por&&+o.por>=+o.de) return '<span class="pct">O preço da promoção precisa ser menor que o normal.</span>';
  if(o.de&&o.por) return `<span class="pct">${pctNum(o)}% de desconto</span> · o cliente economiza ${brl(o.de-o.por)}`;
  return 'Preencha os dois preços para a arte mostrar o desconto.';
}
function promoText(p){
  const o=p.promo; if(!o) return '';
  const un=S.niche==='turismo'?' por pessoa':'', t=[];
  if(o.de&&o.por&&+o.por<+o.de) t.push(`De ${brl(o.de)} por ${brl(o.por)}${un} (${pctNum(o)}% OFF).`); else if(o.por||o.de) t.push(`Por ${brl(o.por||o.de)}${un}.`);
  if(o.parc&&o.parc!=='À vista') t.push(`Em até ${o.parc}.`);
  if(o.bonus.length) t.push(o.bonus.join(' + ')+'.');
  if(o.restam) t.push(`Restam só ${o.restam} ${S.niche==='turismo'?'vagas':'unidades'}.`);
  if(o.urg) t.push(o.urg+'!');
  if(o.cupom) t.push(`Cupom: ${o.cupom}`);
  return t.join(' ');
}
function priceHTML(p){
  const o=p.promo; if(!o||!(o.por||o.de)) return '';
  const hasDe=o.de&&o.por&&+o.por<+o.de;
  return `<div class="price">${hasDe?`<s>De ${brl(o.de)}</s>`:''}<b>${brl(o.por||o.de)}</b>${o.parc&&o.parc!=='À vista'?`<small>em até ${esc(o.parc)}</small>`:''}${S.niche==='turismo'?'<small>por pessoa</small>':''}</div>`;
}
const offHTML = p => { const v=pctNum(p.promo); return v>0?`<span class="offtag">-${v}%</span>`:''; };
function urgHTML(p){
  const o=p.promo; if(!o) return '';
  return [o.urg, o.restam?`Restam ${o.restam} ${S.niche==='turismo'?'vagas':'un.'}`:'', ...o.bonus].filter(Boolean).map(x=>`<span class="urg">${esc(x)}</span>`).join('');
}

function bindArt(){
  $$('[data-car]').forEach(c=>{
    const t=c.querySelector('.car-track'), dots=[...c.querySelectorAll('.car-dots i')];
    const upd=()=>{ const i=Math.round(t.scrollLeft/t.clientWidth); dots.forEach((d,j)=>d.classList.toggle('on',j===i)); };
    t.onscroll=()=>{ cancelAnimationFrame(t._r); t._r=requestAnimationFrame(upd); };
    c.querySelector('[data-cprev]').onclick=()=>t.scrollBy({left:-t.clientWidth, behavior:reduce?'auto':'smooth'});
    c.querySelector('[data-cnext]').onclick=()=>t.scrollBy({left:t.clientWidth, behavior:reduce?'auto':'smooth'});
    upd();
  });
  $$('[data-play]').forEach(b=>b.onclick=()=>{
    const r=b.closest('.rv'), paused=r.classList.toggle('paused'), v=r.querySelector('video');
    if(v) paused?v.pause():v.play();
    b.innerHTML=ic(paused?'play':'pause'); b.setAttribute('aria-label', paused?'Reproduzir':'Pausar');
  });
}
function refreshArt(p, toEnd){
  const el=$('#art-'+p.id); if(!el) return;
  el.outerHTML=creative(p);
  const t=$('#art-'+p.id+' .car-track'); if(t&&toEnd) t.scrollLeft=t.scrollWidth;
  bindArt();
}

/* ---------- gerar os arquivos finais (imagens, vídeos, legendas) e o .zip ---------- */
const FD='"Bricolage Grotesque","Segoe UI",sans-serif', FB='"Nunito Sans","Segoe UI",sans-serif';
const imgCache={};
const B = () => ({b1:S.a.cor1, b1i:ink(S.a.cor1), b2:S.a.cor2, b2i:ink(S.a.cor2)});
function loadImg(src){
  if(!src) return Promise.resolve(null);
  return imgCache[src] || (imgCache[src]=new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }));
}
async function mediaSrc(p){
  if(p.media?.type==='video'){
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.loop=true; v.src=p.media.url;
    await new Promise(r=>{ v.onloadeddata=r; v.onerror=r; setTimeout(r,4000); });
    return v.readyState>=2 ? v : loadImg(`img/${p.img}.jpg`);
  }
  return loadImg(p.media?.type==='image' ? p.media.url : `img/${p.img}.jpg`);
}
async function loadFonts(){ try{ await Promise.all([`800 40px ${FD}`,`800 40px ${FB}`,`700 40px ${FB}`,`600 40px ${FB}`].map(f=>document.fonts.load(f))); }catch(e){} }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function cover(ctx,img,W,H,z=1,px=0,py=0){

function shade(ctx,W,H){

  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function wrapLines(ctx,text,maxW){
  const out=[]; let cur='';
  for(const w of String(text).split(/\s+/).filter(Boolean)){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ out.push(cur); cur=w; } else cur=t; }
  if(cur) out.push(cur); return out;
}
function label(ctx,text,x,y,u,color){
  ctx.save(); ctx.font=`800 ${4.4*u}px ${FB}`; if('letterSpacing' in ctx) ctx.letterSpacing=`${.26*u}px`;
  ctx.globalAlpha=.85; ctx.fillStyle=color; ctx.textBaseline='top'; ctx.fillText(String(text).toUpperCase(),x,y); ctx.restore();
}
function hl(ctx,text,x,y,maxW,size,bg,fg,{draw=true,align='left'}={}){
  ctx.font=`800 ${size}px ${FD}`; const pad=size*.22, L=wrapLines(ctx,text,maxW-pad*2), lh=size*1.25;
  if(draw) L.forEach((l,i)=>{ const w=ctx.measureText(l).width+pad*2, bx=align==='center'?x+(maxW-w)/2:x, by=y+i*lh;
    ctx.fillStyle=bg; rr(ctx,bx,by,w,lh*.96,size*.14); ctx.fill(); ctx.fillStyle=fg; ctx.textBaseline='middle'; ctx.fillText(l,bx+pad,by+lh*.5); });
  return L.length*lh;
}
function plain(ctx,text,x,y,maxW,size,color,{font=FB,weight=700,lh=1.3,align='left',draw=true}={}){
  ctx.font=`${weight} ${size}px ${font}`; const L=wrapLines(ctx,text,maxW);
  if(draw){ ctx.fillStyle=color; ctx.textBaseline='top'; ctx.textAlign=align; L.forEach((l,i)=>ctx.fillText(l,align==='center'?x+maxW/2:x,y+i*size*lh)); ctx.textAlign='left'; }
  return L.length*size*lh;
}
function capBox(ctx,text,x,bottom,maxW,size){
  ctx.font=`800 ${size}px ${FB}`; const pad=size*.55, L=wrapLines(ctx,text,maxW-pad*2), lh=size*1.3, h=L.length*lh+pad*2, y=bottom-h;
  ctx.fillStyle='rgba(0,0,0,.6)'; rr(ctx,x,y,maxW,h,size*.45); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textBaseline='middle'; L.forEach((l,i)=>ctx.fillText(l,x+pad,y+pad+lh*i+lh/2)); return h;
}
function priceBox(ctx,p,x,y,u,{center=false,draw=true}={}){
  const o=p.promo; if(!o||!(o.por||o.de)) return {w:0,h:0};
  const rows=[];
  if(o.de&&o.por&&+o.por<+o.de) rows.push({t:`De ${brl(o.de)}`, f:`700 ${4.4*u}px ${FB}`, s:4.4*u, c:'#777', strike:true});
  rows.push({t:brl(o.por||o.de), f:`800 ${11*u}px ${FD}`, s:11*u, c:'#111'});
  if(o.parc&&o.parc!=='À vista') rows.push({t:`em até ${o.parc}`, f:`700 ${4*u}px ${FB}`, s:4*u, c:'#111'});
  if(S.niche==='turismo') rows.push({t:'por pessoa', f:`700 ${4*u}px ${FB}`, s:4*u, c:'#111'});
  let w=0,h=0; rows.forEach(r=>{ ctx.font=r.f; w=Math.max(w,ctx.measureText(r.t).width); h+=r.s*1.15; });
  const px=5*u, py=3.5*u, bw=w+px*2, bh=h+py*2, bx=center?x-bw/2:x;
  if(draw){
    ctx.fillStyle='#fff'; rr(ctx,bx,y,bw,bh,4*u); ctx.fill(); let yy=y+py;
    rows.forEach(r=>{ ctx.font=r.f; ctx.fillStyle=r.c; ctx.textBaseline='top'; ctx.fillText(r.t,bx+px,yy);
      if(r.strike) ctx.fillRect(bx+px,yy+r.s*.55,ctx.measureText(r.t).width,Math.max(2,u*.35)); yy+=r.s*1.15; });
  }
  return {w:bw,h:bh};

function urgItems(p){ const o=p.promo; return o?[o.urg, o.restam?`Restam ${o.restam} ${S.niche==='turismo'?'vagas':'un.'}`:'', ...o.bonus].filter(Boolean).map(s=>s.toUpperCase()):[]; }
function chipRow(ctx,p,x,y,maxW,u,{draw=true,center=false}={}){
  const items=urgItems(p); if(!items.length) return 0;
  const c=B(), s=4.4*u, ph=3*u, ch=s*1.2+2.8*u, gap=1.5*u; ctx.font=`800 ${s}px ${FB}`;
  const rows=[[]]; let rw=0;
  items.forEach(t=>{ const w=ctx.measureText(t).width+ph*2; if(rw+w>maxW&&rows.at(-1).length){ rows.push([]); rw=0; } rows.at(-1).push({t,w}); rw+=w+gap; });
  if(draw) rows.forEach((r,ri)=>{ const tot=r.reduce((a,i)=>a+i.w,0)+gap*(r.length-1); let cx=center?x+(maxW-tot)/2:x; const cy=y+ri*(ch+gap);
    r.forEach(i=>{ ctx.fillStyle=c.b1; rr(ctx,cx,cy,i.w,ch,2*u); ctx.fill(); ctx.fillStyle=c.b1i; ctx.textBaseline='middle'; ctx.fillText(i.t,cx+ph,cy+ch/2); cx+=i.w+gap; }); });
  return rows.length*ch+(rows.length-1)*gap;

function offBadge(ctx,p,W,u){

  ctx.save(); ctx.font=`800 ${6*u}px ${FB}`; const w=ctx.measureText(t).width+6*u, h=7.2*u+3*u;
  ctx.translate(W-6*u-w/2, 6*u+h/2); ctx.rotate(4*Math.PI/180); ctx.fillStyle='#E0393E'; rr(ctx,-w/2,-h/2,w,h,3*u); ctx.fill();

function band(ctx,W,H,u){ ctx.fillStyle=B().b1; ctx.fillRect(0,H-3.5*u,W,3.5*u); }
function wmk(ctx,W,H,u,logo,color){

function pollBox(ctx,opts,x,bottom,mw,u){
  const s=5.2*u, rowH=s*1.2+5.2*u, gap=2.5*u, h=8*u+opts.length*rowH+(opts.length-1)*gap, y=bottom-h, c=B();

function drawSingle(ctx,p,W,H,img,logo){
  const u=W/100, c=B(), vert=H>W, g=unq(p.f[0][1]), x=8*u, mw=W-16*u, bottom=H-20*u;
  ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H); cover(ctx,img,W,H); if(img) shade(ctx,W,H);

    if(p.promo){ const ch=chipRow(ctx,p,x,0,mw,u,{draw:false}), pb=priceBox(ctx,p,x,0,u,{draw:false}), top=bottom-ch-2*u-pb.h; priceBox(ctx,p,x,top,u); chipRow(ctx,p,x,top+pb.h+2*u,mw,u); }
