  if(i===0){
    ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H); cover(ctx,img,W,H); if(img) shade(ctx,W,H);
    label(ctx,`1/5 · ${PILLAR[p.pillar]}`,x,9*u,u,'#fff');
    const sh=plain(ctx,'Arraste para o lado →',x,0,mw,5*u,'#fff',{draw:false}), th=hl(ctx,p.title,x,0,mw,9.5*u,c.b1,c.b1i,{draw:false}), ty=H-20*u-sh-4*u-th;
    hl(ctx,p.title,x,ty,mw,9.5*u,c.b1,c.b1i); plain(ctx,'Arraste para o lado →',x,ty+th+4*u,mw,5*u,'#fff');
    if(p.promo) offBadge(ctx,p,W,u); band(ctx,W,H,u); wmk(ctx,W,H,u,logo,'#fff');
  } else if(i===1){
    ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H); label(ctx,`2/5 · ${f[0][0]}`,x,9*u,u,c.b2i); centerText(g,9.5*u,c.b2i); band(ctx,W,H,u); wmk(ctx,W,H,u,logo,c.b2i);
  } else if(i===2){
    ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H); cover(ctx,img2||img,W,H); shade(ctx,W,H);
    label(ctx,`3/5 · ${f[1][0]}`,x,9*u,u,'#fff'); capBox(ctx,unq(f[1][1]),x,H-20*u,mw,5.8*u); band(ctx,W,H,u); wmk(ctx,W,H,u,logo,'#fff');
  } else if(i===3){
    ctx.fillStyle=c.b1; ctx.fillRect(0,0,W,H); label(ctx,`4/5 · ${f[2][0]}`,x,9*u,u,c.b1i); centerText(unq(f[2][1]),8*u,c.b1i); wmk(ctx,W,H,u,logo,c.b1i);
  } else {
    ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H); label(ctx,'5/5',x,9*u,u,c.b2i);
    const size=p.promo?6.5*u:8*u, pb=priceBox(ctx,p,x,0,u,{draw:false}), ch=chipRow(ctx,p,x,0,mw,u,{draw:false}), th=plain(ctx,unq(f[3][1]),x,0,mw,size,c.b2i,{font:FD,weight:800,lh:1.2,draw:false});
    const tot=(pb.h?pb.h+3*u:0)+(ch?ch+3*u:0)+th; let y=(H-tot)/2;
    if(pb.h){ priceBox(ctx,p,x,y,u); y+=pb.h+3*u; } if(ch){ chipRow(ctx,p,x,y,mw,u); y+=ch+3*u; }
    plain(ctx,unq(f[3][1]),x,y,mw,size,c.b2i,{font:FD,weight:800,lh:1.2}); band(ctx,W,H,u); wmk(ctx,W,H,u,logo,c.b2i);
  }
}
function drawReel(ctx,p,t,W,H,src,logo){
  const u=W/100, c=B(), f=p.f, x=8*u, mw=W-16*u, T=12, isVid=src&&src.tagName==='VIDEO';
  const k=Math.min(1,t/T), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H);
  cover(ctx,src,W,H,isVid?1:1.03+.17*e,isVid?0:-.03*e,isVid?0:-.02*e); shade(ctx,W,H);
  const seg=Math.min(3,Math.floor(t/3)), lt=t-seg*3, a=Math.min(1,lt/.3)*(seg<3?Math.min(1,(3-lt)/.15):1);
  ctx.save(); ctx.globalAlpha=Math.max(0,a);
  if(seg===0){
    label(ctx,S.a.nome||'',x,12*u,u,'#fff'); const h=hl(ctx,unq(f[0][1]),x,0,mw,9.5*u,c.b1,c.b1i,{draw:false}); hl(ctx,unq(f[0][1]),x,(H-h)/2,mw,9.5*u,c.b1,c.b1i);
  } else if(seg===1){ capBox(ctx,unq(f[1][1]),x,H-22*u,mw,5.8*u); }
  else if(seg===2){ let b=H-22*u; if(p.promo){ const ch=chipRow(ctx,p,x,0,mw,u,{draw:false}); if(ch){ chipRow(ctx,p,x,b-ch,mw,u); b-=ch+3*u; } } capBox(ctx,unq(f[2][1]),x,b,mw,5.8*u); }
  else {
    ctx.fillStyle=c.b2; ctx.fillRect(0,0,W,H);
    const lh=logo?Math.min(.2*H, 45*u*logo.naturalHeight/logo.naturalWidth):9*u*1.2, pb=priceBox(ctx,p,W/2,0,u,{center:true,draw:false}), th=plain(ctx,unq(f[3][1]),x,0,mw,5*u,c.b2i,{align:'center',draw:false});
    let y=(H-(lh+4*u+(pb.h?pb.h+4*u:0)+th))/2;
    if(logo){ const lw=lh*logo.naturalWidth/logo.naturalHeight; ctx.drawImage(logo,(W-lw)/2,y,lw,lh); }
    else { ctx.font=`800 ${9*u}px ${FD}`; ctx.fillStyle=c.b2i; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(S.a.nome||'',W/2,y); ctx.textAlign='left'; }
    y+=lh+4*u; if(pb.h){ priceBox(ctx,p,W/2,y,u,{center:true}); y+=pb.h+4*u; }
    plain(ctx,unq(f[3][1]),x,y,mw,5*u,c.b2i,{align:'center'});
  }
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(0,0,W,1.3*u); ctx.fillStyle=c.b1; ctx.fillRect(0,0,W*k,1.3*u);
  if(p.promo) offBadge(ctx,p,W,u);
  band(ctx,W,H,u); wmk(ctx,W,H,u,seg===3?null:logo,seg===3?c.b2i:'#fff');
}
async function renderPost(p,i,W,H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const [img,img2,logo]=await Promise.all([mediaSrc(p), p.fmt==='Carrossel'?loadImg(p.media?.type==='image'&&p.media.url?p.media.url:`img/${p.img2||p.img}.jpg`):null, S.a.logo?loadImg(S.a.logo):null]);
  if(p.fmt==='Reels') drawReel(ctx,p,1.5,W,H,img,logo);
  else if(p.fmt==='Carrossel') drawSlide(ctx,p,i,W,H,img,img2,logo);
  else drawSingle(ctx,p,W,H,img,logo);
  return cv;
}
async function recordReel(p,onFrame){
  const mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime) return null;
  const W=720, H=1280, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  const [src,logo]=await Promise.all([mediaSrc(p), S.a.logo?loadImg(S.a.logo):null]);
  if(src&&src.tagName==='VIDEO'){ src.currentTime=0; try{ await src.play(); }catch(e){} }
  drawReel(ctx,p,0,W,H,src,logo);
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime, videoBitsPerSecond:5e6}), chunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const stopped=new Promise(r=>rec.onstop=r);
  rec.start(500); const t0=performance.now();
  await new Promise(res=>{ const step=()=>{ const t=(performance.now()-t0)/1000; drawReel(ctx,p,Math.min(t,11.99),W,H,src,logo); onFrame&&onFrame(cv,t); if(t<12) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  rec.stop(); await stopped; if(src&&src.pause) src.pause();
  return {blob:new Blob(chunks,{type:mime.split(';')[0]}), ext:mime.includes('mp4')?'mp4':'webm'};
}
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const isoDay = d => `2026-11-${String(d.getDate()).padStart(2,'0')}`;
const toJpg = cv => new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
const csvCell = v => `"${String(v??'').replace(/"/g,'""')}"`;
function folderName(p){ return `${isoDay(p.date)}_${slug(DIAS[p.date.getDay()])}_${p.time.slice(0,2)}h_${slug(p.fmt)}_${slug(p.title).slice(0,40).replace(/-$/,'')}`; }
function legendaTxt(p){
  return [`${fmtDate(p.date)} de 2026, às ${p.time.replace(':00','h')}`, `Onde postar: ${p.nets.map(n=>NETL[n]).join(', ')}`, `Formato: ${p.fmt} · Tipo: ${PILLAR[p.pillar]}`, `Título: ${p.title}`,
    '', 'LEGENDA (copie e cole)', caption(p), '', p.tags.join(' '), '', 'ROTEIRO', ...p.f.map(([k,v])=>`${k}: ${unq(v)}`)].join('\r\n');
}
function readme(list){
  const used=[...new Set(list.flatMap(p=>[p.media?.type==='image'||p.media?.type==='video'?null:p.img, p.fmt==='Carrossel'?p.img2:null]).filter(Boolean))];
  return [`POSTS DE NOVEMBRO DE 2026 · ${S.a.nome}`, `Gerado pelo PAT (Presença Ativa) em ${new Date().toLocaleDateString('pt-BR')}.`, '',
    'COMO USAR', '1. Cada pasta é um post. O nome começa com a data e o horário, por exemplo: 2026-11-02_seg_19h_reels_...',
    '2. Dentro da pasta estão o vídeo (video.mp4 ou video.webm) ou as imagens (01.jpg a 05.jpg no carrossel), prontos para postar.',
    '3. O arquivo legenda.txt traz o texto para copiar e colar, as hashtags e as redes onde postar.',
    '4. O arquivo calendario.csv abre no Excel ou no Google Planilhas e mostra o mês inteiro.', '',
    'FOTOS DE EXEMPLO (Wikimedia Commons, licenças livres)', ...used.map(k=>CREDITS[k]?`- ${k}.jpg: ${CREDITS[k][0]} · ${CREDITS[k][1]}`:'').filter(Boolean)].join('\r\n');
}
function expList(){ return [...S.posts].sort((a,b)=>a.date-b.date).filter(ready); }
function vBaixar(){
  const e=S.exp, list=expList(), n={Reels:0,Carrossel:0,Stories:0,Post:0}; list.forEach(p=>n[p.fmt]++);
  if(e&&e.running){
    scr().innerHTML=`<div class="stack"><h2 class="h-l">Criando seus posts…</h2><p class="muted small">Os vídeos são gravados em tempo real, cerca de 12 segundos cada. Deixe esta tela aberta.</p></div>
      <div class="progress"><i id="expBar" style="width:${e.pct||0}%"></i></div><p class="small" id="expTxt" style="margin:0">${esc(e.txt||'Preparando…')}</p>
      <div class="exp-prev" id="expPrev"></div>`;
    if(e.canvas) $('#expPrev').appendChild(e.canvas); return;
  }
  if(e&&e.blob){
    scr().innerHTML=`<div class="stack"><h2 class="h-xl">Posts prontos!</h2><p class="muted">${e.count} posts com imagens, vídeos, legendas e a planilha do calendário, num só arquivo.</p></div>
      <div class="stat"><div><b>${e.files}</b><span>arquivos</span></div><div><b>${e.videos}</b><span>vídeos</span></div><div><b>${(e.blob.size/1048576).toFixed(1)}</b><span>MB</span></div></div>
      <button class="btn btn-ok full" id="dlzip">${ic('dl')} Baixar arquivo .zip</button>
      <div class="box stack"><span class="label">O que vem dentro</span>
        <p class="small">Uma pasta para cada post, com a data e o horário no nome, por exemplo <b>2026-11-02_seg_19h_reels…</b></p>
        <p class="small">Dentro: o vídeo ou as imagens prontos para postar e o <b>legenda.txt</b> com texto, hashtags e onde postar.</p>
        <p class="small">Junto: <b>calendario.csv</b>, que abre no Excel ou no Google Planilhas.</p></div>
      <button class="btn btn-soft full" id="regen">${ic('refresh')} Gerar de novo</button>`;
    $('#dlzip').onclick=offerZip; $('#regen').onclick=()=>{ S.exp=null; render(); }; return;
  }
  const secs=n.Reels*12+list.length, rest=[...S.posts].sort((a,b)=>a.date-b.date).filter(p=>p.status!=='reprovado'&&!ready(p));
  const faltaArq=rest.filter(p=>missing(p).length).length;
  const row=(p,extra)=>`<button class="plink" data-open="${p.id}"><span class="date-chip">${p.date.getDate()}<br>nov</span><span><b>${esc(p.title)}</b><br><span class="small muted">${p.fmt} · ${p.time.replace(':00','h')}</span>${extra}</span>${ic('arrow')}</button>`;
  scr().innerHTML=`<div class="stack"><h2 class="h-l">Baixar meus posts</h2><p class="muted small">Só entram os posts aprovados e completos.</p></div>
    <div class="stat"><div class="ok"><b>${list.length}</b><span>prontos</span></div><div><b>${faltaArq}</b><span>faltam arquivos</span></div><div><b>${rest.length-faltaArq}</b><span>falta aprovar</span></div></div>
    <button class="btn btn-pri full" id="gox" ${list.length&&window.JSZip?'':'disabled'}>${ic('dl')} Baixar ${list.length} post${list.length===1?'':'s'} pronto${list.length===1?'':'s'}</button>
    ${list.length?`<p class="muted small" style="margin:0">Tempo estimado: ${secs<60?'menos de 1 minuto':`cerca de ${Math.ceil(secs/60)} minutos`}. Nesta versão os vídeos saem sem música.</p>`:''}
    ${window.JSZip?'':'<p class="small" style="margin:0;color:var(--bad)">O gerador de arquivos não carregou. Verifique a internet e recarregue a página.</p>'}
    <div class="stack" style="gap:8px"><span class="label" style="color:var(--ok)">Prontos para baixar (${list.length})</span>
      ${list.length?list.map(p=>row(p,`<br><span class="small" style="color:var(--ok);font-weight:800">✓ Pronto para postar</span>`)).join(''):'<p class="muted small" style="margin:0">Nenhum post pronto ainda. Envie o que falta e aprove.</p>'}</div>
    ${rest.length?`<div class="stack" style="gap:8px"><span class="label">Ainda não estão prontos (${rest.length})</span>
      ${rest.map(p=>{ const m=missing(p); return row(p, m.length?`<br><span class="small" style="color:var(--bad);font-weight:800">Falta: ${esc(m.map(x=>x.t).join(', '))}</span>`:'<br><span class="small" style="font-weight:800">Falta aprovar</span>'); }).join('')}</div>`:''}`;
  $$('[data-open]').forEach(b=>b.onclick=()=>{ const p=S.posts.find(x=>x.id===b.dataset.open); if(p.status==='pendente'){ S.cur=p.id; go('aprovar'); } else { S.sel=p.id; go('calendario'); } });
  $('#gox').onclick=runExport;
}
async function runExport(){
  const list=expList(); if(!list.length) return;
  S.exp={running:true, pct:0, txt:'Preparando…'}; render();
  const upd=(pct,txt,canvas)=>{
    if(pct!=null) S.exp.pct=pct; if(txt) S.exp.txt=txt; if(canvas) S.exp.canvas=canvas;
    const b=$('#expBar'), t=$('#expTxt'), pv=$('#expPrev');
    if(b) b.style.width=S.exp.pct+'%'; if(t) t.textContent=S.exp.txt;
    if(pv&&canvas&&canvas.parentNode!==pv){ pv.innerHTML=''; pv.appendChild(canvas); }
  };
  try{
    await loadFonts();
    const zip=new JSZip(), base=`posts-novembro-2026-${slug(S.a.nome||'meu-negocio')}`, root=zip.folder(base);
    const rows=[['Data','Dia','Horário','Onde postar','Formato','Tipo','Título','Situação','Pasta','Arquivos','Legenda']];
    const wt=p=>p.fmt==='Reels'?12:1, total=list.reduce((s,p)=>s+wt(p),0);
    let doneW=0, files=0, videos=0;
    for(const p of list){
      const dir=folderName(p), f=root.folder(dir), names=[], what=`${fmtDate(p.date)} · ${p.title}`;
      if(p.fmt==='Reels'){
        const r=await recordReel(p,(cv,t)=>upd(Math.round((doneW+Math.min(t,12))/total*90),`Gravando vídeo: ${what}`,cv));
        if(r){ f.file(`video.${r.ext}`,r.blob); names.push(`video.${r.ext}`); videos++; }
        const cv=await renderPost(p,0,1080,1920); f.file('capa.jpg',await toJpg(cv)); names.push('capa.jpg');
      } else if(p.fmt==='Carrossel'){
        for(let i=0;i<5;i++){ const cv=await renderPost(p,i,1080,1080); upd(null,`Criando imagem ${i+1} de 5: ${what}`,cv); f.file(`0${i+1}.jpg`,await toJpg(cv)); names.push(`0${i+1}.jpg`); }
      } else {
        const v=p.fmt==='Stories', cv=await renderPost(p,0,1080,v?1920:1080), nm=v?'story.jpg':'post.jpg';
        upd(null,`Criando imagem: ${what}`,cv); f.file(nm,await toJpg(cv)); names.push(nm);
      }
      f.file('legenda.txt',legendaTxt(p)); names.push('legenda.txt'); files+=names.length;
      rows.push([isoDay(p.date),DIAS[p.date.getDay()],p.time,p.nets.map(n=>NETL[n]).join(', '),p.fmt,PILLAR[p.pillar],p.title,STL[p.status],dir,names.join(', '),caption(p)+'\n\n'+p.tags.join(' ')]);
      doneW+=wt(p); upd(Math.round(doneW/total*90));
    }
    root.file('calendario.csv','﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'));
    root.file('LEIA-ME.txt',readme(list)); files+=2;
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'},m=>upd(90+Math.round(m.percent/10),'Juntando tudo num arquivo .zip'));
    S.exp={blob, name:base+'.zip', count:list.length, files, videos};
    if(S.view==='baixar') render(); else toast('Seus posts estão prontos para baixar');
  }catch(err){
    console.error(err); S.exp=null; if(S.view==='baixar') render(); toast('Não consegui gerar os arquivos. Tente de novo.');
  }
}
async function offerZip(){
  const e=S.exp; if(!e||!e.blob) return;
  let dl=null;
  if(window.claude?.use){ try{ dl=await window.claude.use('downloads'); }catch(_){} }
  if(dl){
    try{ await dl.save({filename:e.name, data:e.blob}); toast('Arquivo salvo'); }
    catch(err){ toast(err&&err.code==='declined'?'Download cancelado':'Não deu para baixar aqui. Tente abrir o app no navegador.'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(e.blob); a.download=e.name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}

/* ---------- salvar no aparelho ---------- */
const KEY='bancada-v4';
/* a logo é o único item grande: se não couber no localStorage, vai para o IndexedDB */
let logoInIdb=false, logoIdb=null, saveWarned=false;
function save(){
  if(!mediaReady) return; // antes de restaurar logo e fotos, não sobrescreve o que está salvo
  const pack=keepLogo=>JSON.stringify({niche:S.niche, view:S.view==='gerando'?'produtos':S.view, q:S.q, a:keepLogo?S.a:{...S.a, logo:null}, logoIdb:!keepLogo&&!!S.a.logo,
    products:S.products, sel:S.sel, cur:S.cur, stopped:S.stopped, vo:S.vid.o,
    posts:S.posts.map(p=>({...p, date:p.date.toISOString(), media:p.media&&p.media.key?{type:p.media.type,name:p.media.name,key:p.media.key,auto:!!p.media.auto}:null}))});
  try{ localStorage.setItem(KEY, pack(true)); return; }catch(e){}
  if(S.a.logo&&S.a.logo!==logoIdb){ logoIdb=S.a.logo; IDB.put('logo',S.a.logo); }
  try{ localStorage.setItem(KEY, pack(false)); }
  catch(e){ if(!saveWarned){ saveWarned=true; toast('Não consegui salvar o progresso neste aparelho'); } }
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(!d) return;
    S.niche=d.niche||null; Object.assign(S.a, d.a||{}); S.products=d.products||[]; logoInIdb=!!d.logoIdb;
    if(!Array.isArray(S.a.tipo)) S.a.tipo=S.a.tipo?[S.a.tipo]:[]; // versões antigas guardavam uma opção só
    S.posts=(d.posts||[]).map(p=>({...p, date:new Date(p.date)}));
    S.q=d.q||0; S.sel=d.sel; S.cur=d.cur; S.stopped=!!d.stopped; if(d.vo) S.vid.o=d.vo;
    S.view=d.view||'intro';
    if(['calendario','aprovar','video'].includes(S.view)&&!S.posts.length) S.view='intro';
    if(!S.niche) S.view='intro';
  }catch(e){}
}

/* ---------- ligações fixas ---------- */
$('#topback').onclick=()=>{
  if(S.view==='quiz'){ if(S.q>0){ S.q--; render(); } else { S.view='intro'; render(); } }
  else if(S.view==='produtos'){ S.view='quiz'; S.q=questions().length-1; render(); }
};
$$('[data-demo]').forEach(b=>b.onclick=()=>loadDemo(b.dataset.demo));
$$('#jump button').forEach(b=>b.onclick=()=>{
  const g=b.dataset.go;
  if(g==='intro'){ S.view='intro'; render(); return; }
  if(g==='quiz'){ if(!S.niche) S.niche='ferramentas'; S.view='quiz'; S.q=0; render(); return; }
  if(g==='video'){ ensureDemo(); const r=S.posts.find(p=>p.fmt==='Reels'); if(r){ openVideo(r.id); return; } }
  go(g);
});
load();
render();
restoreMedia().then(()=>render());
